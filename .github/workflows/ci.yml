name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Multiplayer deployment smoke test
        if: ${{ vars.MULTIPLAYER_SMOKE_URL != '' }}
        env:
          MULTIPLAYER_SMOKE_URL: ${{ vars.MULTIPLAYER_SMOKE_URL }}
        run: node scripts/multiplayer-smoke.mjs
